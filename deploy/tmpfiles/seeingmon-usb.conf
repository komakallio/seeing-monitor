# Managed by the seeingmon installer. Changes are overwritten.
#
# Raise the USB buffer memory limit of the kernel. The default of 16 MB is smaller than one survey
# frame (23 MB in bin2), and the vendor library needs room for several transfers at once.
# systemd-tmpfiles writes the value at every boot, and the installer applies it once when it
# installs the file, so a reboot is not necessary when the write works.
#
# If the value does not apply, set it on the kernel command line instead. Add this word to the
# single line of /boot/firmware/cmdline.txt, and reboot:
#
#     usbcore.usbfs_memory_mb=@USBFS_MEMORY_MB@
w /sys/module/usbcore/parameters/usbfs_memory_mb - - - - @USBFS_MEMORY_MB@
