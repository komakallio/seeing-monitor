# Managed by the seeingmon installer. Changes are overwritten.
#
# Time sources for chrony. The installer fills in the sources that you pass with --time-source, one
# "server" line for each. The Raspberry Pi 4 has no real-time clock, so records carry the
# time_invalid flag until chrony synchronizes the clock. The default chrony.conf of Debian already
# steps the clock during the first updates (makestep), so this file adds sources and nothing else.
@TIME_SOURCES@
