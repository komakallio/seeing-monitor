# Template for local/config.toml, the file that holds the values of one installation.
#
# Copy this file to local/config.toml and replace every placeholder. Git ignores local/, and the
# real values must stay there: never put a real site location, address, path, or secret in a
# tracked file. An environment variable overrides a key in this file. Write
# SEEINGMON_<SECTION>__<KEY>=value, for example SEEINGMON_SITE__ELEVATION_M=12.5.

# A short name (letters, digits, '.', '_', '-') that tags every record from this station.
station_id = "my-station"

# The hardware profile: a file stem in profiles/, or a path to a profile file.
profile = "asi294mm-gs250"

# The observing site. The values below are placeholders (0.0 is not your site). Enter your own
# here, in the untracked file only. Latitude is north-positive, longitude is east-positive. The
# scheduler reads the site to compute the Sun's elevation for the daylight gate and the twilight
# flag. Without a [site] table, it relies on the measured sky brightness alone.
[site]
latitude_deg = 0.0
longitude_deg = 0.0
elevation_m = 0.0

# Scheduler overrides. The defaults live in config/default.d/scheduler.toml, and every one of them
# is provisional until commissioning. Override a key only on this station, for example:
# [scheduler.fast]
# window_s = 120.0
# [scheduler.survey]
# cadence_s = 180.0
# An environment variable works too: SEEINGMON_SCHEDULER__FAST__WINDOW_S=120

[paths]
# The folder for the store and the segment files. Use a partition with room to spare.
data_dir = "<path to the data folder>"

[replay]
# The folder with recorded bursts for the replay driver and the recordings tests.
recordings_dir = "<path to the recordings folder>"

[auth]
# The hash of the API token that authorizes commands. Store the hash, never the token. Create both
# with `seeingmon web hash-token --generate`: the command prints the token on the standard error,
# for you to keep in a password manager, and the hash on the standard output, for you to paste here.
# Run `seeingmon web hash-token` alone to hash a token of your own: it reads the token from a
# hidden prompt or from the standard input, never from an argument. The hash may instead come from
# SEEINGMON_AUTH__TOKEN_HASH, from a systemd credential named seeingmon-token-hash, or from a file
# (token_hash_file = "<path to a file with the hash>"). Without a hash, the API refuses every
# command.
token_hash = "<hash of the API token>"

# The web process: the REST API, the UI, and the alignment live view. The defaults live in
# config/default.d/web.toml. Set the LAN address of this device, so that the process listens on
# that interface only (a wildcard address such as 0.0.0.0 is an error). The default address is the
# loopback interface. Reads are open on the LAN unless you set require_token_for_reads, and every
# POST needs the token. The lines below only show the shape.
#
# To reach the UI through a VPN, such as a tailnet, bind the address of the VPN interface too
# (extra_bind_addresses), and list the names that clients type (allowed_hosts). The server answers
# a request only when its Host header names the loopback interface, a bind address (the bind
# addresses are always allowed, so list names only), or an entry of allowed_hosts. The entries
# below are documentation addresses and example names.
# [web]
# bind_address = "<LAN address of this device>"
# extra_bind_addresses = ["192.0.2.10", "2001:db8::10"]
# allowed_hosts = ["seeing-pi", "seeing-pi.tailnet.example"]
# port = 8080
# require_token_for_reads = false
# [web.rate_limit]
# commands_per_window = 30

# Survey path. `seeingmon catalog build` writes the cap catalog and the solver index files, and
# `seeingmon dark` adds dark sets to the library in darks/ of the calibration folder.
# [survey]
# catalog_path = "<path to the cap catalog file>"
# index_dir = "<path to the astrometry.net index folder>"
# calibration_dir = "<path to the calibration folder>"
# night_split_utc_hour = 12.0  # the UTC hour that ends a night: pick one when the Sun is up

# Local connections between the acquire, core, and web processes. The processes prove that they
# hold the same key before they talk, so every installation needs one. Generate it with
# `python -c "import secrets; print(secrets.token_urlsafe(32))"`. The key may instead come from
# SEEINGMON_SERVICES__CONNECTION_KEY or from a systemd credential. The addresses are optional:
# an empty address selects a socket file in the runtime directory on Linux and a named pipe on
# Windows. The lines below only show the shape.
# [services]
# connection_key = "<random string of 32 or more characters>"
# connection_key_file = "<path to a file that holds the connection key>"
# acquire_address = "<socket path on Linux, or pipe name on Windows>"
# core_address = "<socket path on Linux, or pipe name on Windows>"
#
# [services.acquire]
# driver = "<name of the camera driver>"
#
# The reboot step of the recovery ladder. Core runs this argument list without a shell. With no
# command, a reboot step does nothing and writes an event.
# [services.core.escalation]
# reboot_command = ["<path to the reboot program>", "<argument>"]
#
# The alignment helper compares the solved position of Polaris with a target. Take the target
# from a reference solution at commissioning. The values below are placeholders.
# [alignment]
# target_x_px = 0.0
# target_y_px = 0.0
# target_roll_deg = 0.0

# Result sinks. Each sink is a table named for the sink, [sinks.<name>]. Keep the name stable,
# because the forwarder stores the cursor of the sink under it. Remove the "# " from the lines of
# the sinks that you use. Give a secret with token_env or password_env, which name an environment
# variable (for example in a systemd EnvironmentFile), or set it directly with token or password
# here, or with SEEINGMON_SINKS__<NAME>__TOKEN. Every endpoint and secret stays in this untracked
# file and never goes into a tracked one. Add enabled = false to switch a sink off, and
# record_types = ["seeing_window", "health"] to send fewer record types.
#
# InfluxDB 2.x or 3.x (version = 2, the default). It posts to /api/v2/write.
# [sinks.lab_influx]
# kind = "influx"
# endpoint = "https://influx.example.org:8086"
# org = "<organization>"
# bucket = "<bucket>"
# token_env = "<name of the environment variable that holds the token>"
#
# InfluxDB 1.x. It posts to /write.
# [sinks.old_influx]
# kind = "influx"
# version = 1
# endpoint = "https://influx.example.org:8086"
# database = "<database>"
# username = "<user name>"
# password_env = "<name of the environment variable that holds the password>"
#
# PostgreSQL or TimescaleDB. It needs the "timescale" extra: pip install 'seeingmon[timescale]'.
# [sinks.archive]
# kind = "timescale"
# host = "timescale.example.org"
# database = "<database>"
# user = "<user name>"
# password_env = "<name of the environment variable that holds the password>"

# Hardware. Every part below stays off until you enable it, and every value is a placeholder. The
# lines only show the shape. See docs/hardware-checks.md for how to test each part.
#
# The camera. Choose the asi driver in [services.acquire], and give it the vendor library. The
# environment variable SEEINGMON_ASI__LIBRARY_PATH works too. The installer puts the library in a
# private folder and sets the path for you.
# [services.acquire]
# driver = "asi"
# [services.acquire.driver_options]
# library_path = "<path to the ASI SDK library>"
#
# The dew heater. Name each line by a logical name, and map the name to a chip and a line offset
# (find the chip with `gpiodetect`). `active_low` flips the level for a relay board that switches
# on a low level. The sensors read files that a kernel driver exposes (hwmon or iio). `optics` is
# optional, and `keepalive` and `fault_input` suit a HAT with a watchdog or a fault output.
# [heater]
# enabled = true
# output = "heater"
# [heater.pins.heater]
# chip = "<GPIO chip, such as gpiochip0>"
# line = 0
# active_low = false
# [heater.ambient]
# kind = "sysfs"
# temperature_file = "<path to the temperature file of the air sensor>"
# humidity_file = "<path to the humidity file of the air sensor>"
# [heater.optics]
# kind = "sysfs"
# temperature_file = "<path to the temperature file of the dew shield sensor>"
#
# The SQM-LE. The pointing is optional. The values below are examples.
# [sqm]
# enabled = true
# host = "<address of the SQM-LE>"
# altitude_deg = 45.0
# azimuth_deg = 0.0
#
# The remote power cycle. Choose one route, `http` or `command`. A ${NAME} in an argument, the URL, a
# header, or the body expands from the environment when the cycle runs, so no secret needs to sit
# in this file. Set state_file, so that the limits survive the reboot that the cycle causes.
# [power]
# route = "http"
# state_file = "<path to a writable file>"
# [power.http]
# method = "POST"
# url = "http://<address of the smart plug>/<path of the cycle request>"
# headers = { Authorization = "Bearer ${PLUG_TOKEN}" }
# [power.command]
# argv = ["<path to the program>", "<argument>"]
