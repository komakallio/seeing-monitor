# Defaults of the survey path. Every key sits under [survey], and no other file defines one.
#
# Paths belong to one installation, so they stay empty here: set them in local/config.toml.
# The other values are provisional. They follow the "Pointing" section of docs/architecture.md
# and the research notes, and they stay until commissioning (phase 3) shows what a real sky
# needs. Override a key in local/config.toml, or with an environment variable such as
# SEEINGMON_SURVEY__SOLVE__TIMEOUT_S=30.

[survey]
# The cap catalog that `seeingmon catalog build` writes.
catalog_path = ""
# The folder with the astrometry.net cap index files that the same command builds.
index_dir = ""
# A NumPy file (.npy) with the boolean hot-pixel mask of the survey mode, from the dark frames.
# Empty means no mask.
hot_pixel_file = ""
# The folder with the calibration files. The dark library lives in its darks/ subfolder, where
# `seeingmon dark` adds the sets. Empty means that the pipeline subtracts no dark level.
calibration_dir = ""
# A measured flat field of the survey mode: a 2-D image of the whole sensor with a median of 1 (.npy
# or FITS). `seeingmon flat make` builds one from frames of a lit panel, and `seeingmon flat build` from the
# survey frames of the night sky (which gives no tilt, so `--base-flat` takes the tilt from a panel flat).
# Empty means a unit flat: no correction. A flat that you activate on the Flat page of the web UI wins
# over this file (the flat library is calibration_dir/flats/), and it needs no restart. The previews of
# the survey frames and the live view of the Align page divide by the flat too, when the dark library
# has a set for the frame.
flat_file = ""
# The UTC hour that ends one night and starts the next. Pick an hour when the Sun is up at your
# site, so that no night splits in two. The star epochs, the transparency reference, the events
# sky.dark and sky.clear_verdict ([survey.darkness]), and the visibility summary
# ([survey.visibility]) group by night. core writes the visibility summary of a night when this hour
# passes. Polaris can be visible in daylight, so measure can run across this hour, and the summary
# then counts the first or the last detection of the night as censored.
night_split_utc_hour = 12.0
# The solver programs. Each runs as a separate process, so its GPL or MPL code stays outside
# this MIT code base.
solve_field_command = "solve-field"
astap_command = "astap"
astap_database_dir = ""   # Empty uses the star database that ASTAP finds by itself.
# The solvers to try, in order, after the tracker fails to match the frame by itself.
solvers = ["astrometry.net", "astap"]
# UT1 - UTC in seconds (the IERS bulletins publish it). It moves the Earth rotation angle by
# 15 arcsec for each second, so 0 is wrong by up to 0.9 s of that.
dut1_s = 0.0

# Star detection.
[survey.detect]
threshold_sigma = 5.0
min_pixels = 2
mesh_px = 64
edge_margin_px = 6.0
max_stars = 3000
max_saturated_pixels = 6   # A star with more saturated pixels is measured by moments only.
trail_flag_px = 1.5
# 1 searches the full frame for stars. 2 (the default) searches a copy that sums each 2 x 2 block,
# which takes a quarter of the time, and fits only the brightest refine_stars stars at full
# resolution. The other stars keep a coarse position and the `COARSE` flag, and the pointing fit,
# the photometry, and the focus leave them out. A frame with no trail model (the first one after
# a start) always takes the full search.
coarse_bin = 2
refine_stars = 1200

# The pointing fit.
[survey.fit]
match_radius_px = [4.0, 2.0, 1.2]   # One match pass for each radius.
clip_sigma = 4.0
min_stars = 4
sigma_floor_px = 0.03
final_match_radius_px = 1.5
# A fit counts as a solution with at least min_stars pairs, a residual of at most max_rms_px,
# and either confident_stars pairs or min_match_fraction of the reliable detections.
max_rms_px = 1.5
min_match_fraction = 0.3
confident_stars = 30

# The tracker and the pointing record.
[survey.pointing]
# The age in seconds at which a solution stops predicting Polaris. 0 sets no limit, because a rigid
# mount keeps its Earth-fixed attitude, and only a solve that succeeds replaces a solution. Set a
# positive value for a mount that is not rigid. Provisional.
validity_s = 0.0
few_stars = 12
moved_arcmin = 5.0
moved_roll_deg = 0.5
tracker_min_stars = 8
tracker_max_rms_px = 1.5
# The JSON reference solution that `seeingmon pointing set-reference` saves, which core loads at
# start. Empty means no reference: the offset of the Pointing card stays empty.
reference_file = ""

# Calls to the plate solvers.
[survey.solve]
timeout_s = 20.0
scale_tolerance = 0.15
hint_radius_deg = 2.0
# The search radius around the pole, where the camera looks: for the first solve, when no pointing
# exists, and for the retry when every solver finds nothing near the prediction, as after a move of
# the mount. 0 searches the whole sky for the first solve and skips the retry, so without an age
# limit ([survey.pointing] validity_s 0) a mount that moved more than hint_radius_deg never solves
# again. Provisional.
pole_hint_radius_deg = 15.0
max_stars = 1000            # The brightest stars go to the solver. An adapter may use fewer.
cross_check_every = 0       # Every Nth solved frame also runs the second solver. 0 never does.
cross_check_max_px = 1.5

# The cloud fraction: the share of expected catalog stars that detection missed.
[survey.cloud]
expected_snr = 20.0
mag_limit = 12.0
edge_px = 20.0
min_expected = 8
match_radius_px = 3.0

# The dark library: how `seeingmon dark` and the dark task of the web UI record a set, and when
# `health` reports `dark_due`.
[survey.dark]
mode = "bin2"                  # The readout mode and the gain of the survey frames.
gain = 120
exposure_s = 30.0              # The survey exposure. The dark rate is the master dark over this.
frames = 9
bias_frames = 9                # Frames at the shortest exposure, for the bias level.
test_exposure_s = 1.0          # The frames that the wait takes to see whether you covered the camera.
poll_s = 5.0
stable_polls = 2               # Dark test frames in a row that count as covered.
wait_timeout_s = 1800.0
max_temperature_spread_c = 2.0 # A larger drift during a set gets a warning.
rate_factor = 3.0              # A dark frame rises at most this many times the expected dark rate,
min_rate_e_per_s = 0.5         # and the limit is never below this rate.
noise_factor = 1.5
max_tail_fraction = 0.001      # The share of pixels that may stand far above the median.
hot_sigma = 6.0                # A hot pixel rises this many robust sigmas above its neighbors,
hot_min_excess_dn = 3.0        # and by at least this many counts.
doubling_c = 6.0               # The prior doubling temperature of the dark current.
temperature_tolerance_c = 3.0  # A set this close to the sensor temperature counts for `dark_due`.
max_age_days = 183.0           # A set older than this (about six months) does not count.

# The flat session of the web UI: it takes frames of a light source over the aperture, and it takes
# the readout mode and the gain from [survey.dark].
[survey.flat]
start_exposure_s = 0.02        # The search for the exposure starts here.
max_exposure_s = 1.0           # The longest exposure that the search may reach.
max_iterations = 8             # The most frames that the search takes.
level_tolerance = 0.1          # The search stops within this share of the target level.
min_level_fraction = 0.25      # A weaker light at the longest exposure (share of full scale) is too dim.
drift_percent = 3.0            # A frame this far from the median level warns of a drifting light.

# Aperture photometry of the matched stars: a circle of aperture_px (stretched by the trail), and
# a ring around it for the background.
[survey.photometry]
aperture_px = 5.0
annulus_inner_px = 9.0
annulus_outer_px = 14.0
min_annulus_px = 150
clip_sigma = 3.0
isolation_flux_ratio = 0.02    # A neighbor with this share of the flux spoils a star.
min_snr = 20.0                 # A star needs this signal-to-noise ratio for the zero point.
# The aperture correction: the brightest isolated stars also get a wide aperture, and the median
# ratio of the wide flux to the narrow flux corrects the narrow one for the wings of the profile.
growth_aperture_px = 12.0
growth_stars = 40              # 0 turns the correction off.

# The zero-point fit against Gaia G, with a color term in BP-RP.
[survey.zero_point]
min_stars = 8
clip_sigma = 3.0
systematic_mag = 0.01          # Added to every star: flat field, scintillation, aperture loss.
color_term_prior = 0.0         # The color term when the colors span too narrow a range.
min_color_std = 0.25
g_min = 0.0                    # The catalog magnitude range of the stars in the fit.
g_max = 13.0

# The sky brightness and its V equivalent.
[survey.sky]
clip_sigma = 3.0
edge_px = 8
mask_radius_scale = 3.0
bp_rp = 1.0                    # The color that the V conversion assumes for the sky.
sqm_offset_mag = 0.0           # The offset that seeingmon.survey.sqm_fit gives at commissioning.
# A shorter frame, such as the 1 ms frame of a survey step, gets no sky quality. Keep it at or below
# [survey.twilight] min_exposure_s, so that every adaptive long frame gets the record. It also sets
# which frames core counts as long (a preview, and the unsolved and cloud events). Provisional.
min_exposure_s = 1.0

# The reference zero point, transparency, and the cloud flag.
[survey.transparency]
window_days = 60.0
quantile = 0.9
min_samples = 20
min_stars = 12
max_rms_mag = 0.15
max_cloud_fraction = 0.2
cloud_flag_fraction = 0.3
transparency_flag = 0.6
# A frame without a zero point may use the median of this many hours. 0 turns it off.
fallback_hours = 6.0

# The nightly star summary (the star_epoch record).
[survey.star_epoch]
min_frames = 3
min_snr = 20.0

# The survey in a bright sky. The scheduler reads target_background_fraction, min_exposure_s, and
# max_background_fraction, and the pipeline reads the last two. All four values are provisional:
# phase 3 sets them from real twilight skies.
[survey.twilight]
# The long exposure of each survey step puts the sky background at this share of saturation: from
# the 1 ms frame of the step at first, and from the previous long frame after that, changing by at
# most 4 times a step, between min_exposure_s and [scheduler.survey] long_exposure_s. In a dark sky
# it stays at long_exposure_s. Provisional.
target_background_fraction = 0.3
# The shortest adaptive long exposure, in seconds. When even this would pass the target, the step
# skips its long exposure and keeps the 1 ms frame, which the daylight gate reads. Provisional.
min_exposure_s = 1.0
# A frame with more saturated pixels than this share gets the flag saturated_sky, and no zero point,
# transparency, cloud fraction, limiting magnitude, or sky brightness. Provisional.
max_saturated_fraction = 0.01
# So does a frame whose sky background passes this share of saturation. The scheduler reads it too:
# while the last long frame was beyond it at min_exposure_s, and the 1 ms frame has not darkened
# since, the next step skips its long exposure. It must lie above target_background_fraction.
# Provisional.
max_background_fraction = 0.8

# The events sky.dark and sky.clear_verdict, which core writes from the survey results, each at
# most once a night (night_split_utc_hour). sky.dark needs the sky brightness of the frames, which
# needs a dark set, and the verdict follows sky.dark, so a station without a dark set gets neither.
# All four values are provisional.
[survey.darkness]
# The sky counts as dark when a line fitted to the sky brightness of the last `frames` solved frames
# changes by less than this many magnitudes per hour. The sky stops changing near the darkest time
# of every night, so the rule fires on a summer night too, when the Sun stays above -18 degrees. On
# a winter night at mid-northern latitudes, the twilight sky still changes by about 1.5 mag an hour
# as the Sun passes -18 degrees. Provisional.
max_slope_mag_per_hour = 0.3
# The solved frames in the fit, at least 2. A long survey frame that did not solve, or that has no
# sky brightness, starts the run again, so that the line never spans a cloudy stretch, such as one
# from the dusk to the dawn. At the survey cadence of 180 s, 5 frames span 12 minutes. Provisional.
frames = 5
# The longest time between two frames of the fit, in seconds. A longer gap starts the run again, so
# that the line never spans hours without frames, such as while the scheduler is paused or degraded.
# Keep it above [scheduler.survey] cadence_s (180 s): 600 s lets the scheduler skip two survey steps
# in a row. Provisional.
max_gap_s = 600.0
# The frames after sky.dark that the clear verdict covers: the long frames with a cloud fraction,
# solved or not, because a frame that thick clouds keep from solving still gets a cloud fraction
# from the stored pointing. The verdict gives the share of them at or below [scheduler.cloud]
# clear_threshold. Provisional.
verdict_frames = 5

# The visibility summary of Polaris, which core writes once a night when night_split_utc_hour
# passes. A detection is censored (a bound, not the moment when Polaris appeared or vanished) when
# Polaris was visible at the start or the end of the night, or when the station did not watch the
# sky for longer than max_gap_s between the start of the night and the first detection, or between
# the last detection and the end. The station watches while core runs and the scheduler is in auto
# or safe without a fault of the camera, as the health records show. A fault of the heater or the
# SQM-LE reader does not stop the search, so it counts as watching. Provisional.
[survey.visibility]
# The longest stretch without watching, in seconds, that leaves a detection uncensored. The last
# health record before a stop vouches for the station for health_span_intervals, so an outage of up
# to max_gap_s plus that span (300 s + 180 s = 480 s with a health_interval_s of 60 s in
# [services.core]) leaves a detection uncensored. The Sun's elevation changes by at most 15 degrees
# an hour, and less away from the equator, so such an outage moves a detection by at most 2 degrees
# of the Sun's elevation. A restart of core takes less than that. Provisional.
max_gap_s = 300.0
# How many health intervals ([services.core] health_interval_s) a health record vouches for the
# station, at least 1. Above 1, a record or two that come late, from a busy supervisor thread, make
# no gap and cut no measure short. Provisional.
health_span_intervals = 3.0
# How many nights, the newest night that ended included, the first run after a start of core checks
# for a missing summary, oldest first. A night in which core never ran gets none. 7 covers a week of
# downtime. A night that has its summary costs one read of the store, and core writes one missing
# night every 30 s, so the catch-up never holds its supervisor thread for long. Provisional.
catch_up_nights = 7
