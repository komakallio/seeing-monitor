# Defaults of the web lane: the REST API, the static UI, and the alignment live view. Every key
# sits under [web], and seeingmon.services.web.config declares the same defaults. Override a key
# in local/config.toml, or with an environment variable such as SEEINGMON_WEB__PORT=8081.
#
# The addresses and host names of one installation and the hash of its API token belong to the
# untracked local file (see config/local.example.toml), and never to this file. The hash lives in
# [auth].

[web]
# The one interface that the process binds. Set the LAN address of this device in the local file.
# The default is the loopback interface, so a fresh install is reachable from this device only. A
# wildcard address (0.0.0.0 or ::) is an error.
bind_address = "127.0.0.1"

# More interfaces that the process binds, such as the address of a VPN interface of this device. It
# listens on each address (and on bind_address) on the same port, from one event loop. Each entry
# is one interface address, and a wildcard is an error. If an address cannot be bound, the process
# exits and names it. The default is no extra address. Set the addresses in the local file.
extra_bind_addresses = []
port = 8080

# The names and addresses that a client may use to reach the server. A request carries the host in
# its Host header, and a browser sends the host of the page in the Origin header of a WebSocket.
# The server answers a request only when its host is in this list, or is one of localhost,
# 127.0.0.1, ::1, bind_address, and the entries of extra_bind_addresses, which are always allowed.
# Any other host gets an error, so a page from another site cannot reach the server through the
# browser of a visitor. An entry is an IPv4 address, an IPv6 address, or a DNS name, compared
# without case and without a trailing dot, and a wildcard is an error. This rule does not change
# who may read or send commands. Set the names of one installation in the local file.
allowed_hosts = []

# Reads are open on the LAN by default. Set this to true to ask for the API token on every read
# too. Every POST needs the token in any case.
require_token_for_reads = false

# /health answers 503 when the newest health record is older than this many seconds.
health_max_age_s = 180.0

# How often the Now page refreshes, in seconds.
ui_refresh_s = 10.0

# Record fields that the API serves as null with a quality note, because they narrow down the
# site. The zenith angle of Polaris is about 90 degrees minus the site latitude.
withhold_fields = ["zenith_angle_deg"]

# Log every request. The log never holds a token.
access_log = false

# How long a clean shutdown waits for open connections, in seconds.
shutdown_timeout_s = 5.0

# The largest body of a request, in bytes. A command body is a few hundred bytes.
max_body_bytes = 16384

# Limits per client (a remote address). Every POST counts against commands_per_window. A failed
# token check also counts against auth_failures_per_window, and a client over that limit gets no
# token check until its failures leave the window.
[web.rate_limit]
commands_per_window = 30
window_s = 60.0
auth_failures_per_window = 5
auth_failure_window_s = 300.0
max_clients = 1024

# The size of a page of history, and the most rows that one request reads to build it.
[web.paging]
default_limit = 500
max_limit = 2000
max_scan_rows = 50000
default_range_hours = 24.0

# The image list, and the largest files that the API serves.
[web.images]
default_list_limit = 24
max_list_limit = 200
max_preview_bytes = 8388608
max_fits_bytes = 134217728
scan_days = 31

# The alignment live view. max_fps is the preview cadence: the most frames per second that the
# server sends to one client. The server always sends the newest frame. It reads frames from core
# while a client watches, and for idle_s seconds after the last one has gone. A client that gets no
# frame for stall_s seconds sees the view as stalled.
[web.live]
max_fps = 2.0
idle_s = 10.0
max_clients = 4
stall_s = 5.0

# The link to core. The address and the key come from [services].
[web.core]
connect_timeout_s = 2.0
rpc_timeout_s = 5.0
submit_timeout_s = 10.0
retry_interval_s = 1.0
