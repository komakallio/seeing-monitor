# Defaults of the services lane: the acquire, core, and web processes and the local connections
# between them. Every key lives under [services]. Override a value in local/config.toml, or with a
# SEEINGMON_SERVICES__<KEY> environment variable, for example SEEINGMON_SERVICES__ACQUIRE__DRIVER.

[services]
# Where the processes listen. An empty address selects the default for the platform: a socket
# file in the runtime directory on Linux, and a named pipe on Windows.
acquire_address = ""
core_address = ""

# The processes prove that they hold the same key before they talk. The key is never stored in a
# tracked file. Set connection_key in local/config.toml (or SEEINGMON_SERVICES__CONNECTION_KEY),
# point connection_key_file at a file that holds it, or provide a systemd credential with the
# name below.
connection_key_credential = "seeingmon-connection-key"
connection_key_file = ""

# Seconds to keep trying to connect, to wait for the answer of a call, and to wait for the
# first messages of a new connection.
connect_timeout_s = 5.0
rpc_timeout_s = 30.0
handshake_timeout_s = 5.0

# Flow control of a frame stream: the receiver accepts this many messages and bytes before it
# has consumed the first ones. The sender holds frames back, and the acquire queue drops the
# oldest frame when it fills.
stream_window_messages = 64
stream_window_bytes = 67108864

# The most frames that one message of the frame stream holds. `core` asks for this many and
# `acquire` sends up to this many, so a stream of 100 frames a second pays for a message about
# every 60 ms (see `batch_delay_s` in the acquire section). 1 sends one frame in each message.
stream_batch_frames = 16

# The largest message that a connection accepts, in bytes.
max_rpc_bytes = 1048576
max_frame_bytes = 134217728

[services.clock]
# `system` is the operating system clock. `scaled` (with start_utc_ns, origin_real_ns, and speed)
# runs faster than real time and exists for end-to-end tests.
kind = "system"

# How the system clock learns whether it is synchronized: `adjtimex` reads the state of the kernel
# clock that chrony steers (Linux only), `none` leaves it unknown, and `auto` picks `adjtimex` on
# Linux. An unsynchronized clock marks frames, windows, and records `time_invalid`.
probe = "auto"
speed = 1.0

[services.acquire]
# The camera driver that acquire creates (see seeingmon.drivers), and the options it takes.
driver = "sim"

# The frame queue between the capture thread and the sender thread.
queue_depth = 256
queue_max_bytes = 100663296

# Batches. The sender holds a fast stream back for up to this many seconds and sends the frames
# that arrived in that time as one message, up to `batch_bytes` bytes. A frame waits at most this
# long, and a stream that delivers fewer than 1.5 frames in that time sends each frame at once.
# 0 turns the delay off.
batch_delay_s = 0.06
batch_bytes = 262144

# A frame read waits this many frame periods plus a margin before it reports a timeout.
read_timeout_factor = 2.0
read_timeout_margin_s = 0.5
default_frame_period_s = 1.0
error_backoff_s = 0.05

# Timing. The latency is the delay between the end of the readout and the arrival stamp, and
# commissioning measures it with a light pulse. The sigma is its uncertainty. `auto` keeps the
# time of a frame that a simulator or a replay stamped exactly. `stamp` fits the arrival times
# of every frame, and `driver` never changes a time.
time_source = "auto"
latency_s = 0.0
latency_sigma_s = 0.005
arrival_jitter_s = 0.002
unknown_clock_error_s = 0.1
invalid_clock_error_s = 86400.0
fit_window = 128
fit_warmup = 20
outlier_sigmas = 6.0
outlier_floor_s = 0.003
step_frames = 3

# A gap between two frames longer than this many frame periods counts as lost frames.
gap_factor = 1.5

# Raise the priority of the capture thread where the platform allows it.
raise_priority = true

# How acquire calls the driver from its capture thread and its control thread. `serialize` lets
# one thread in at a time, for a driver that is not thread-safe. `concurrent` trusts a driver that
# is. `auto` serializes unless the driver says that it is thread-safe.
driver_threads = "auto"

# The watchdog thread ticks this often, tells systemd that the process lives (only under systemd),
# and logs a health summary.
watchdog_tick_s = 0.25
heartbeat_interval_s = 5.0
health_log_interval_s = 60.0

[services.acquire.driver_options]

[services.acquire.call_timeouts]
# A driver call that takes longer makes acquire exit, and systemd restarts it.
open_s = 60.0
close_s = 30.0
capabilities_s = 10.0
configure_s = 60.0
start_s = 30.0
stop_s = 30.0
move_roi_s = 10.0
temperature_s = 10.0
dropped_s = 10.0
recover_s = 180.0
read_grace_s = 5.0

[services.core]
# How often core writes a health record, and how often it collects the hardware events of the
# driver in acquire.
health_interval_s = 60.0
events_interval_s = 5.0

# The run record names the camera, which core learns when the scheduler opens it. After this wait,
# core writes the record without the camera.
run_record_wait_s = 30.0

# How long the shutdown may take before core gives up on a thread.
shutdown_timeout_s = 30.0

# The watchdog of systemd. Core stops sending WATCHDOG=1 when the scheduler thread makes no
# progress for scheduler_stall_s, outside a call of the camera driver. A driver call has its own
# limit, driver_call_limit_s, which exceeds the longest timeout of the remote driver.
scheduler_stall_s = 60.0
driver_call_limit_s = 240.0

# The most RPC clients at once: web, and the commands burst, sweep, and replay.
max_rpc_connections = 8

# A JSON file with a pointing solution that starts the pointing tracker. It stays empty: a real
# installation gets its first solution from a plate solver. The dev launcher sets it for a
# simulated sky.
seed_solution_file = ""

[services.core.survey_worker]
# `process` runs the survey analysis in a worker process at a lower priority. On Linux the worker
# also gets a higher oom_score_adj, so that the out-of-memory killer takes it before it takes core.
# `thread` runs it in a thread of core, and `inline` in the scheduler thread (for tests).
mode = "process"
nice = 10
oom_score_adj = 500

[services.core.survey_frames]
# What core keeps of the survey frames. `false` keeps nothing: no preview, no FITS file, and no
# image_ref on the survey_frame record.
enabled = true
# The newest frames that stay in the memory of core (a bin2 frame takes 23 MB). Two are needed for
# the writer: a frame stays until its result comes back and its files are written, the result of
# the short frame of a survey step comes back only after the long exposure that follows it has
# arrived, and a frame that falls out of this number before then gets no files. Nothing reads the
# frames of a larger ring, because web is another process. A tmpfs file in the runtime directory
# would serve them later.
ram_frames = 2
# Every long frame (an exposure of at least [survey.sky] min_exposure_s) gets a preview. Every
# keep_every-th long frame, and every event frame, also goes to disk as a FITS file under survey/.
keep_every = 10
# A preview is a JPEG of at most this many pixels, under previews/.
jpeg_quality = 80
preview_max_pixels = 1000000
# `rice` writes tile-compressed FITS files (about 40% of the frame). `none` writes them whole.
fits_compression = "rice"
# An event frame is the first frame after a condition starts: no pointing solution, a pointing
# that moved, clouds (a cloud fraction at or above event_cloud_fraction), or a sky so bright that
# the background reaches event_background_fraction of the saturation level. Each kind of frame
# (long and short) gets at most one event frame in this many seconds.
event_min_interval_s = 3600.0
event_cloud_fraction = 0.5
event_background_fraction = 0.5

[services.core.escalation]
# After a restart request, core waits this long for acquire to go away.
restart_acquire_wait_s = 15.0

# The command that reboots the machine, as an argument list that core runs without a shell. The
# list stays empty here: set it in local/config.toml, or no reboot happens. The power cycle uses
# the [power] section.
reboot_command = []
command_timeout_s = 30.0

[services.core.commissioning]
# The longest burst that the burst handler records, in seconds.
burst_max_duration_s = 600.0

# The folder under the data directory where a replay writes its separate store. Retention does not
# manage it: delete an old replay by hand.
replays_dir = "replays"

[services.core.sky_flags]
# Core adds the moon and dew flags to each sky_quality record. The scheduler sets twilight, cloud,
# and time_invalid. The Moon counts when its center is above this elevation (degrees) and at least
# this share of its disk is lit.
moon_min_elevation_deg = 0.0
moon_min_illumination = 0.1

# The optics count as dewy when their temperature is this close to the dew point (degrees Celsius).
dew_margin_c = 1.0

[alignment]
# The alignment helper of core: a live view and a quick solve while the scheduler is in `align`.
#
# The live view needs no configuration. It aims the pole at the center of the frame, and it draws
# a fixed circle there with the radius of the orbit of Polaris. If you want the pole somewhere else,
# name that pixel of the alignment stream (the survey readout mode) in local/config.toml. The two
# keys go together.
# aim_x_px = 0.0
# aim_y_px = 0.0
#
# The target is where Polaris belongs in the frame of the alignment stream, in pixels of the
# survey readout mode, and the roll that the camera should have. The Offset card of the live view
# compares Polaris with it. They stay unset here, and nothing needs them. Polaris circles the pole
# once a day, so a fixed target fits one time of day only. Take them from a reference solution at
# commissioning, and set them in local/config.toml.
# target_x_px = 0.0
# target_y_px = 0.0
# target_roll_deg = 0.0

# The preview: JPEG quality, the most pixels in the image, and the shortest time between frames.
jpeg_quality = 80
max_preview_pixels = 1000000
min_interval_s = 0.1

# A solve starts at most this often, and a solved position older than the limit is not current.
solve_interval_s = 1.0
solution_max_age_s = 10.0

# The histogram, and the saturation warning: the share of pixels that reach `saturation_level` of
# the saturation level of the readout mode.
histogram_bins = 64
saturation_level = 0.98
saturation_warn_fraction = 0.0005

# While a live view is open, core tells the scheduler this often that someone watches.
touch_interval_s = 5.0
