# Defaults of the fast path. Every key sits under [fastpath], and no other file defines one.
#
# ALL VALUES ARE PROVISIONAL. They follow the "Seeing (fast)" section of docs/architecture.md, and
# they stay unchanged until commissioning (phase 3) finds the final exposure, gain, ROI, and
# cadence under a real sky. Hardware values (the aperture, the plate scale, the saturation level,
# the conversion gain) come from the profile, so none of them appears here. The estimator stores
# the assumptions that a reader needs to undo them with every window (see docs/quantities.md).
# Override a key in local/config.toml, or with an environment variable such as
# SEEINGMON_FASTPATH__OUTER_SCALE_M=30.

[fastpath]

# --- windows ---
window_s = 60.0                  # The length of one window, in seconds of frame time.
min_window_s = 5.0               # A shorter window gets no seeing statistics.
min_valid_fraction = 0.5         # Below this share of usable frames, no seeing statistics.
saturated_window_fraction = 0.02 # The share of saturated frames above which a window carries `saturated`.

# --- the kernel ---
# `aperture_diameter_px` is absent on purpose: the kernel derives it from the profile, as the larger
# of aperture_min_px and aperture_airy_widths Airy FWHM of the readout mode. Set the key to force a size.
aperture_min_px = 15.0           # The aperture is at least this many pixels across (bin1: about 16).
aperture_airy_widths = 12.0      # The derived aperture, in Airy FWHM of the readout mode.
recenter_iterations = 2          # Recenters of the aperture on the centroid.
border_px = 4                    # Width of the ROI border that gives the background (median).
border_step = 2                  # Use the border pixels at every second row and column.
edge_margin_px = 1.0             # A star within the aperture radius plus this of the ROI edge: edge.
saturation_fraction = 0.98       # The share of the ADC full scale that flags saturation.
min_star_snr = 6.0               # A matched-filter SNR below this is a missing star.
hot_pixel_ratio = 0.03           # An isolated brightest pixel (neighbors below this share): hot pixel.
# Provisional. The FWHM of the Gaussian of the matched filter, in Airy FWHM of the readout mode
# (1.33 px in bin1). The filter's SNR decides whether the star is there, in the search bursts and
# in the missing-star test. In the simulator's image of Polaris, 1.0 to 1.2 give the highest SNR,
# within 0.4% of each other (docs/research-notes.md, "Polaris in a bright sky").
matched_fwhm_airy_widths = 1.0

# --- the seeing estimator ---
outer_scale_m = 20.0             # The assumed outer scale L0. It lowers a 50 mm aperture's variance by 21%.
assumed_wind_ms = 10.0           # The assumed wind speed for the exposure correction.
detrend_order = 2                # The order of the polynomial that each window removes per axis.
outlier_sigma = 8.0              # Frames beyond this many robust sigma of the residuals drop out (0: off).
g_tilt_coefficient = 0.170       # K in sigma^2 = K lambda^2 D^(-1/3) r0^(-5/3) (Martin 1987).
fwhm_coefficient = 0.98          # The seeing FWHM is this times lambda / r0.
zenith_correction = true         # Convert r0 and the seeing to the zenith when the context has a zenith angle.
apply_centroid_gain = true       # Divide the variance by the windowed-centroid ratio of the aperture.
structure_lag_min_s = 0.04       # The structure-function cross-check uses lags from this ...
structure_lag_max_s = 0.12       # ... to this, in seconds (at least one frame).
min_samples = 100                # Usable frames that each axis needs for a seeing estimate.

# --- the spectrum ---
welch_segment_s = 2.0            # The length of a Welch segment, in seconds.
welch_overlap = 0.5              # The overlap of the segments.
psd_bins = 24                    # The number of logarithmic bins in the record.
max_interp_gap_frames = 3        # A gap of up to this many frames is interpolated for the spectrum.
max_interp_fraction = 0.1        # A segment with a larger share of interpolated frames is skipped.
vibration_threshold = 5.0        # A line is a bin above this multiple of the local median.
vibration_local_bins = 15        # Bins on each side that give the local median.
vibration_min_hz = 4.0           # Lines below this frequency are not searched: the spectrum is red there.

# --- scintillation ---
scintillation_trend_s = 1.0      # Moving-average length that removes slow flux changes, in seconds.

# --- the live estimate ---
# The rolling seeing value for the live video: the same estimator as a window, on the newest frames.
live_enabled = true              # `false` keeps no ring and computes no live value.
live_span_s = 10.0               # The newest seconds of frame time that one estimate uses.
live_every_s = 2.0               # The estimate repeats after this many seconds of frame time.
live_min_span_s = 4.0            # No estimate until the stream has run this long.

# --- buffers ---
max_buffered_metrics = 200000    # Rows of per-frame metrics that wait for drain_metrics (4.4 MB at most).
