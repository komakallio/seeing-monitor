# Defaults of the scheduler. Every key sits under [scheduler], and no other file defines one.
#
# ALL VALUES ARE PROVISIONAL. They follow the "Scheduler" section of docs/architecture.md, and
# they stay unchanged until commissioning (phase 3) finds the final exposure, gain, ROI, and
# cadence under a real sky. Hardware values (readout modes, saturation levels, ROI sizes) come
# from the profile, so none of them appears here. Override a key in local/config.toml, or with
# an environment variable such as SEEINGMON_SCHEDULER__FAST__WINDOW_S=60.

# The fast stream. The readout mode is the profile's fast mode.
[scheduler.fast]
window_s = 120.0            # One fast period. Use a multiple of analysis_window_s.
analysis_window_s = 60.0    # The window length of the fast analyzer. Match [fastpath] window_s.
exposure_us = 2000          # 2 ms at most, because Polaris saturates a longer exposure in bin1.
gain = 0
high_speed = false          # The camera's high-speed mode: faster frames, fewer ADC bits (bin1: 10).
roi_arcmin = 4.1            # The profile turns this angle into pixels.
roi_edge_margin_px = 16.0   # A star nearer than this to the ROI edge ends the window.
edge_cooldown_s = 5.0       # The shortest stream time between two edge recenters.
missing_star_frames = 450   # Frames in a row without the star: the period ends, and search returns.
# Provisional. The adaptive exposure: before each fast period and each search burst, the exposure
# scales so that the sky background of the last window or burst would sit at this share of
# saturation, between the profile's shortest exposure and exposure_us. The first period or burst in
# `auto` takes the background from the brightness frame. The exposure changes only where a stream
# starts, so every window has one. 0 turns it off: every period and burst takes exposure_us.
target_background_fraction = 0.3

# The survey step. The readout mode is the profile's survey mode.
[scheduler.survey]
cadence_s = 180.0           # Start of one cycle to the start of the next.
short_exposure_s = 0.001    # Bright stars, and the brightness check of the sky.
short_gain = 0
long_exposure_s = 30.0      # Faint stars and the sky.
long_gain = 120
max_pending = 4             # Skip the step while this many frames wait for analysis.
solve_wait_s = 120.0        # How long to wait for a pointing solution after a step.
solve_retry_s = 60.0        # The pause between solve attempts.

# The brightness watch in `safe`: one short frame per interval.
[scheduler.watch]
exposure_us = 1000
gain = 0
interval_s = 60.0
roi_arcmin = 20.0           # A central ROI. Use 0 for the full frame.

# The daylight gate: the measured sky alone. The Sun's elevation gates nothing. From the
# brightness frame (the watch frame, or the short survey frame), the gate derives through the
# profile the background that the fast stream would have at the profile's shortest exposure, and
# it compares that share of saturation with the limits below. A 1 ms bin2 frame clips first: at
# its saturation the fast stream would see 3.7% in 32 us, so a clipped frame counts as too bright,
# and `auto` resumes only when the frame falls below brightness_resume_fraction of its saturation.
[scheduler.daylight]
twilight_elevation_deg = -18.0   # Above this, results carry `twilight`.
saturation_limit = 0.5           # A fast background above this share of saturation forces `safe`.
resume_saturation = 0.35         # Hysteresis before `auto` resumes.
brightness_clip_fraction = 0.9   # Provisional. A brightness frame this bright has clipped.
brightness_resume_fraction = 0.6 # Provisional. Hysteresis of the clip before `auto` resumes.

# The search mode of the fast stream, which looks for Polaris before it measures. A burst reads
# burst_frames fast frames on the ROI where the pointing solution predicts Polaris, and it detects
# Polaris when the median SNR of the star in its frames reaches detect_snr within radius_px of the
# prediction. The SNR of a frame is the best of the filters matched to the star's image ([fastpath]
# matched_fwhm_airy_widths). confirm_bursts detections in a row switch the stream to measure. All
# values are provisional: phase 3 sets them from real skies.
[scheduler.search]
burst_frames = 50              # Provisional. About 0.6 s of bin1 frames, 4% of the time.
interval_s = 15.0              # Provisional. From the start of one burst to the next.
detect_snr = 10.0              # Provisional. The median matched SNR of a detection, per frame.
radius_px = 20.0               # Provisional. The largest offset of a detection, in fast-mode px.
confirm_bursts = 2             # Provisional. Detecting bursts in a row that start measure.
# Provisional. The search runs while the Sun is below this. Above it, one probe burst every
# probe_interval_s looks. TOML has no null: 90 or more means no limit. The default is no limit:
# in the detection estimate (docs/research-notes.md, "Polaris in a bright sky"), the matched SNR
# of Polaris in the median frame of a daylight sky is 41, and it falls to 10 only in a sky 1.7 mag
# brighter than the model's daylight, so the SNR never crosses 10 between -18 and +90 degrees.
# With the wider image of the owner's recordings, it is about 13, and the day's sky decides.
max_sun_elevation_deg = 90.0
probe_interval_s = 600.0       # Provisional. The time between probe bursts above the limit.

# The response to clouds. The survey analysis reports the cloud fraction.
[scheduler.cloud]
threshold = 0.5             # At or above: shorten the fast period, survey more often.
clear_threshold = 0.3       # At or below: back to normal. The clear verdict counts such frames.
fast_window_s = 60.0
survey_cadence_s = 100.0       # More often than normal, but long enough for the cycle.

# The alignment helper.
[scheduler.align]
idle_timeout_s = 1800.0     # 30 minutes without activity ends `align`.
exposure_s = 0.5
gain = 120
rapid_focus_idle_timeout_s = 120.0   # Without use, rapid focus returns to the normal view.

# Camera errors: back off, climb the ladder, then turn `degraded`.
[scheduler.faults]
backoff_initial_s = 2.0
backoff_factor = 2.0
backoff_max_s = 60.0
degraded_after = 5          # Failures in a row. A camera that is not connected degrades at once.
slow_retry_s = 600.0        # The pause between attempts once the quick steps have had their turn.
clear_after_frames = 10     # Good frames in a row that clear the failure count.

# The recovery ladder: restart_capture, reopen, usb_reset, restart_acquire, reboot, power_cycle.
# The first three steps run in the driver. The others go to the supervisor through `escalate`.
# The steps up to restart_acquire follow the backoff above (a minute at most). After them, the
# attempts come every slow_retry_s, and a reboot or a power cycle waits for that pace too.
[scheduler.ladder]
attempts_per_level = 2
max_level = "power_cycle"
destructive_interval_s = 21600.0   # At most one reboot or power cycle in 6 hours.

[scheduler.commission]
max_queued = 8
max_results = 50

# The limits of a dark task that the UI or a command queues. The task takes its defaults
# (the frame counts, the exposure) from [survey.dark].
[scheduler.dark]
max_frames = 60             # The most dark frames, and the most bias frames, in one task.
max_label_chars = 80        # The longest label.
max_cover_wait_s = 7200.0   # The longest wait for the cover that one task may ask for, in seconds.

# The default sweep grid. The values explore a range and choose nothing.
[scheduler.sweep]
window_s = 10.0
exposure_us = [500, 1000, 2000, 5000, 10000]
gain = [0, 60, 120]
roi_arcmin = [4.1]
modes = []                  # An empty list means the profile's fast mode.
max_cells = 200

# The run loop.
# A frame read waits `read_timeout_factor` frame periods plus `read_timeout_margin_s`. The driver
# reports the period: the video model of the profile for a stream, and the snapshot model for a
# single exposure (a brightness or survey frame), which is much longer. Raise the margin only for a
# camera or host that is slower than the profile says.
[scheduler.loop]
max_sleep_s = 0.25
poll_interval_s = 0.1
read_timeout_factor = 2.0
read_timeout_margin_s = 0.5
context_refresh_s = 30.0
stall_s = 10.0              # A sleep this much late writes the event scheduler.stalled.
