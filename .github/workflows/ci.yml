name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# On main, one run goes at a time, and at most one waits behind it. A newer push replaces the run
# that waits, so a burst of pushes from several lanes tests the newest commit instead of queuing a
# run (six jobs) for each commit, which outran the runners. A run in progress always finishes.
# Superseded pull request runs cancel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.21"
  UV_PYTHON_DOWNLOADS: never

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Test jobs tolerate a stale lock, so a lane that adds a dependency never turns the
      # test results red. The `lock` job reports the stale lock, and the lead regenerates it.
      - name: Install
        run: uv sync --python "${{ matrix.python }}" --all-extras

      - name: Format
        run: uv run --no-sync ruff format --check .

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Type check
        run: uv run --no-sync mypy

      - name: Test
        run: uv run --no-sync pytest

      - name: Repository check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          uv run --no-sync python tools/check_repo.py --commits "$range"

      - name: Secret scan
        run: git ls-files -z | xargs -0 uv run --no-sync detect-secrets-hook --baseline .secrets.baseline

  lock:
    name: Lock file is current
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Check the lock
        run: uv lock --check
