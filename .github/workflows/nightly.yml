name: Nightly

# The slow tests (long end-to-end runs and the longer validation runs) skip on every push, so a
# nightly job runs them. Start it by hand from the Actions tab or with `gh workflow run nightly.yml`.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.21"
  UV_PYTHON_DOWNLOADS: never

defaults:
  run:
    shell: bash

jobs:
  slow:
    name: Slow tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.13"
          - os: ubuntu-24.04
            python: "3.13"
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04-arm
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --python "${{ matrix.python }}" --all-extras

      - name: Slow tests
        run: uv run --no-sync pytest --slow -m slow
